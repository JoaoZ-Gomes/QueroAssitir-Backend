spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:.env.local[.properties]

  application:
    name: QueroAssistir Backend

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        base-url: https://generativelanguage.googleapis.com/v1
        chat:
          options:
            model: gemini-2.5-flash
            temperature: 0.2
            response-mime-type: application/json

  tmdb:
    api-key: ${TMDB_API_KEY}
    base-url: https://api.themoviedb.org/3

recommendation:
  quality:
    min-vote-average: 6.0
    min-vote-count: 100

server:
  address: 0.0.0.0
  port: ${PORT:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,https://*.onrender.com,https://*.vercel.app}
  
  # ============================================================
  # CONFIGURAÇÃO DE IA GENERATIVA PARA EXPLICAÇÕES
  # ============================================================
  ai:
    explanation:
      # Habilita/desabilita geração de explicações personalizadas
      enabled: ${AI_EXPLANATION_ENABLED:true}
      
      # Temperatura para o Gemini (0.0 = determinístico, 1.0 = criativo)
      # Valores:
      # - 0.3-0.5: Respostas consistentes e previsíveis
      # - 0.7-0.8: Variedade moderada (RECOMENDADO para explicações)
      # - 0.9-1.0: Muito criativo mas pode ser incoerente
      temperature: ${AI_EXPLANATION_TEMPERATURE:0.8}

logging:
  level:
    org.springframework.ai: DEBUG
    org.springframework.web.client.RestTemplate: DEBUG
    com.google.genai: DEBUG
    com.queroassistir.backend: DEBUG
